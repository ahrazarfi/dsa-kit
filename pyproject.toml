[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dsa-kit"
version = "0.2.0"
description = "Scaffold, run and check DSA practice problems, with a VS Code layout"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"

[project.scripts]
new = "dsa.cli:new_main"
dsa = "dsa.cli:main"

[tool.setuptools.packages.find]
include = ["dsa*"]

[tool.setuptools.package-data]
dsa = ["data/*"]
